[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttree"
version = "0.2.1"
description = "A hierarchical multi-agent orchestration framework for developers."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["agents", "orchestration", "llm", "mcp", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1,<2"]
langgraph = ["langgraph>=1,<2"]
mcp = ["mcp>=1.29.1,<2"]
openai = ["openai>=1.66,<3"]
gemini = ["google-genai>=1,<2"]
ollama = ["ollama>=0.4,<1"]
providers = ["openai>=1.66,<3", "google-genai>=1,<2", "ollama>=0.4,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agenttree*"]

[tool.setuptools.package-data]
agenttree = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
